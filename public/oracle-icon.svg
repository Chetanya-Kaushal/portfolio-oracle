<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C74634"/>
      <stop offset="50%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <!-- Inner glow -->
    <radialGradient id="innerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C74634" stop-opacity="0"/>
    </radialGradient>
    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C74634"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="#0A0A0A"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.4" filter="url(#softGlow)"/>

  <!-- Hex grid pattern (subtle) -->
  <g opacity="0.08">
    <!-- Row 1 -->
    <polygon points="128,180 148,168 168,180 168,204 148,216 128,204" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="168,180 188,168 208,180 208,204 188,216 168,204" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="208,180 228,168 248,180 248,204 228,216 208,204" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="248,180 268,168 288,180 288,204 268,216 248,204" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="288,180 308,168 328,180 328,204 308,216 288,204" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="328,180 348,168 368,180 368,204 348,216 328,204" fill="none" stroke="#C74634" stroke-width="1"/>
    <!-- Row 2 -->
    <polygon points="148,216 168,204 188,216 188,240 168,252 148,240" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="188,216 208,204 228,216 228,240 208,252 188,240" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="228,216 248,204 268,216 268,240 248,252 228,240" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="268,216 288,204 308,216 308,240 288,252 268,240" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="308,216 328,204 348,216 348,240 328,252 308,240" fill="none" stroke="#C74634" stroke-width="1"/>
    <!-- Row 3 -->
    <polygon points="168,252 188,240 208,252 208,276 188,288 168,276" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="208,252 228,240 248,252 248,276 228,288 208,276" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="248,252 268,240 288,252 288,276 268,288 248,276" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="288,252 308,240 328,252 328,276 308,288 288,276" fill="none" stroke="#C74634" stroke-width="1"/>
    <!-- Row 4 -->
    <polygon points="188,288 208,276 228,288 228,312 208,324 188,312" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="228,288 248,276 268,288 268,312 248,324 228,312" fill="none" stroke="#C74634" stroke-width="1"/>
    <polygon points="268,288 288,276 308,288 308,312 288,324 268,312" fill="none" stroke="#C74634" stroke-width="1"/>
  </g>

  <!-- Circuit lines -->
  <g opacity="0.12" stroke="#00D4FF" stroke-width="1" fill="none">
    <line x1="100" y1="256" x2="180" y2="256"/>
    <line x1="332" y1="256" x2="412" y2="256"/>
    <line x1="256" y1="100" x2="256" y2="180"/>
    <line x1="256" y1="332" x2="256" y2="412"/>
    <circle cx="180" cy="256" r="3" fill="#00D4FF"/>
    <circle cx="332" cy="256" r="3" fill="#00D4FF"/>
    <circle cx="256" cy="180" r="3" fill="#00D4FF"/>
    <circle cx="256" cy="332" r="3" fill="#00D4FF"/>
    <!-- Diagonal circuits -->
    <line x1="130" y1="130" x2="195" y2="195"/>
    <line x1="382" y1="130" x2="317" y2="195"/>
    <line x1="130" y1="382" x2="195" y2="317"/>
    <line x1="382" y1="382" x2="317" y2="317"/>
    <circle cx="130" cy="130" r="2.5" fill="#7B61FF"/>
    <circle cx="382" cy="130" r="2.5" fill="#7B61FF"/>
    <circle cx="130" cy="382" r="2.5" fill="#7B61FF"/>
    <circle cx="382" cy="382" r="2.5" fill="#7B61FF"/>
  </g>

  <!-- Main hexagonal frame -->
  <polygon points="256,60 440,166 440,346 256,452 72,346 72,166"
    fill="none" stroke="url(#mainGrad)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner hex -->
  <polygon points="256,90 410,182 410,330 256,422 102,330 102,182"
    fill="#0A0A0A" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.8"/>

  <!-- Inner glow overlay -->
  <circle cx="256" cy="240" r="120" fill="url(#innerGlow)"/>

  <!-- Neural network nodes inside -->
  <g opacity="0.2">
    <circle cx="200" cy="200" r="4" fill="#00D4FF"/>
    <circle cx="312" cy="200" r="4" fill="#00D4FF"/>
    <circle cx="200" cy="300" r="4" fill="#7B61FF"/>
    <circle cx="312" cy="300" r="4" fill="#7B61FF"/>
    <circle cx="256" cy="160" r="3" fill="#00FF88"/>
    <circle cx="256" cy="340" r="3" fill="#00FF88"/>
    <circle cx="160" cy="256" r="3" fill="#C74634"/>
    <circle cx="352" cy="256" r="3" fill="#C74634"/>
    <!-- Connections -->
    <line x1="200" y1="200" x2="256" y2="160" stroke="#00D4FF" stroke-width="0.8"/>
    <line x1="312" y1="200" x2="256" y2="160" stroke="#00D4FF" stroke-width="0.8"/>
    <line x1="200" y1="300" x2="256" y2="340" stroke="#7B61FF" stroke-width="0.8"/>
    <line x1="312" y1="300" x2="256" y2="340" stroke="#7B61FF" stroke-width="0.8"/>
    <line x1="200" y1="200" x2="160" y2="256" stroke="#00D4FF" stroke-width="0.8"/>
    <line x1="200" y1="300" x2="160" y2="256" stroke="#7B61FF" stroke-width="0.8"/>
    <line x1="312" y1="200" x2="352" y2="256" stroke="#00D4FF" stroke-width="0.8"/>
    <line x1="312" y1="300" x2="352" y2="256" stroke="#7B61FF" stroke-width="0.8"/>
    <line x1="200" y1="200" x2="312" y2="300" stroke="#C74634" stroke-width="0.5"/>
    <line x1="312" y1="200" x2="200" y2="300" stroke="#C74634" stroke-width="0.5"/>
  </g>

  <!-- "CK" text -->
  <text x="256" y="268" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="96" font-weight="700" fill="url(#mainGrad)" filter="url(#glow)">CK</text>

  <!-- Subtitle -->
  <text x="256" y="310" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="6">ORACLE</text>

  <!-- Accent dots -->
  <circle cx="206" cy="310" r="2" fill="#C74634"/>
  <circle cx="306" cy="310" r="2" fill="#00D4FF"/>

  <!-- Outer rotating accent (decorative) -->
  <g opacity="0.3">
    <circle cx="256" cy="60" r="4" fill="#C74634"/>
    <circle cx="440" cy="166" r="4" fill="#FF6B6B"/>
    <circle cx="440" cy="346" r="4" fill="#7B61FF"/>
    <circle cx="256" cy="452" r="4" fill="#00D4FF"/>
    <circle cx="72" cy="346" r="4" fill="#00FF88"/>
    <circle cx="72" cy="166" r="4" fill="#C74634"/>
  </g>
</svg>
