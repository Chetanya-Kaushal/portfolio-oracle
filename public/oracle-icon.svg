<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C74634"/>
      <stop offset="55%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#C74634" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="coreDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark crystal base -->
  <circle cx="256" cy="256" r="250" fill="#0A0A0A"/>

  <!-- Radiating energy -->
  <circle cx="256" cy="250" r="190" fill="url(#coreGlow)"/>

  <!-- Outer beveled hexagonal frame -->
  <polygon points="256,52 356,110 416,202 416,310 356,402 256,460 156,402 96,310 96,202 156,110"
    fill="#0A0A0A" stroke="url(#edgeGrad)" stroke-width="3" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Gemini dual triangle core (futuristic AI star) -->
  <polygon points="256,96 396,330 116,330"
    fill="rgba(199,70,52,0.10)" stroke="url(#coreGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#coreDrop)"/>
  <polygon points="256,416 116,182 396,182"
    fill="rgba(0,212,255,0.08)" stroke="url(#edgeGrad)" stroke-width="2" stroke-linejoin="round" opacity="0.85"/>

  <!-- Inner neural ring -->
  <circle cx="256" cy="256" r="82" fill="none" stroke="url(#coreGrad)" stroke-width="2" opacity="0.6" stroke-dasharray="6 10"/>
  <circle cx="256" cy="256" r="62" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.45" stroke-dasharray="2 6"/>

  <!-- Neural network nodes -->
  <!-- Top -->
  <circle cx="256" cy="96" r="5" fill="#00D4FF"/>
  <circle cx="256" cy="96" r="14" fill="url(#nodeGlow)" opacity="0.8"/>
  <!-- Right -->
  <circle cx="396" cy="330" r="5" fill="#7B61FF"/>
  <circle cx="396" cy="330" r="14" fill="url(#purpleGlow)" opacity="0.8"/>
  <!-- Left -->
  <circle cx="116" cy="330" r="5" fill="#C74634"/>
  <!-- Bottom-left -->
  <circle cx="156" cy="402" r="4" fill="#00FF88"/>
  <!-- Bottom-right -->
  <circle cx="356" cy="402" r="4" fill="#C74634"/>
  <!-- Top-right inner -->
  <circle cx="356" cy="110" r="4" fill="#00FF88"/>

  <!-- Neural connections from core -->
  <g stroke="#00D4FF" stroke-width="1.6" opacity="0.75">
    <line x1="282" y1="250" x2="338" y2="206"/>
    <line x1="282" y1="262" x2="338" y2="308"/>
  </g>
  <g stroke="#7B61FF" stroke-width="1.6" opacity="0.75">
    <line x1="230" y1="250" x2="174" y2="206"/>
    <line x1="230" y1="262" x2="174" y2="308"/>
  </g>
  <g stroke="#FF6B6B" stroke-width="1.4" opacity="0.9">
    <line x1="256" y1="232" x2="256" y2="178"/>
    <line x1="256" y1="280" x2="256" y2="334"/>
  </g>
  <!-- Diagonal data beams -->
  <g stroke="#C74634" stroke-width="1" opacity="0.5">
    <line x1="222" y1="236" x2="196" y2="210"/>
    <line x1="290" y1="276" x2="316" y2="302"/>
  </g>

  <!-- Central core -->
  <circle cx="256" cy="256" r="30" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="17" fill="#0A0A0A"/>
  <circle cx="256" cy="256" r="17" fill="none" stroke="url(#coreGrad)" stroke-width="2.5" filter="url(#coreDrop)"/>
  <circle cx="256" cy="256" r="16" fill="url(#coreGrad)" opacity="0.22"/>

  <!-- CK monogram -->
  <text x="256" y="263" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="600" fill="#FAFAFA" opacity="0.92">CK</text>

  <!-- HUD corner ticks -->
  <g stroke="#C74634" stroke-width="2" opacity="0.7">
    <line x1="96" y1="196" x2="96" y2="176"/>
    <line x1="116" y1="110" x2="110" y2="120"/>
  </g>
  <g stroke="#00D4FF" stroke-width="2" opacity="0.7">
    <line x1="416" y1="316" x2="416" y2="336"/>
    <line x1="356" y1="408" x2="362" y2="398"/>
  </g>

  <!-- Spark nodes -->
  <circle cx="256" cy="52" r="4" fill="#FF6B6B"/>
  <circle cx="416" cy="202" r="4" fill="#00D4FF"/>
  <circle cx="416" cy="310" r="4" fill="#7B61FF"/>
  <circle cx="256" cy="460" r="4" fill="#00FF88"/>
</svg>